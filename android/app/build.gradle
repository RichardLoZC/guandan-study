plugins { id 'com.android.application' }

android {
    namespace 'com.guandan.study'
    compileSdk 36
    defaultConfig {
        applicationId 'com.guandan.study'
        minSdk 26
        targetSdk 36
        versionCode 238
        versionName '1.8.45'
    }
    signingConfigs {
        release {
            if (System.getenv('GUANDAN_STORE_FILE')) {
                storeFile file(System.getenv('GUANDAN_STORE_FILE'))
                storePassword System.getenv('GUANDAN_STORE_PASSWORD')
                keyAlias 'guandan'
                keyPassword System.getenv('GUANDAN_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.dev'; versionNameSuffix '-test' }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['onnx', 'wasm'] }
}

// Share the exact rules, model, artwork and review implementation with macOS.
def publicManifest = new groovy.json.JsonSlurper().parse(rootProject.file('../scripts/public-runtime-manifest.json'))
def approvedWeb = publicManifest.files.keySet().findAll { it.startsWith('web/') }.collect { it.substring(4) }
def prepareWeb = tasks.register('prepareWeb', Sync) {
    from('../../web') { into 'web'; include(approvedWeb as String[]) }
    from('../web') { into 'web/pad'; include 'pad.js', 'pad.css' }
    into layout.buildDirectory.dir('generated/guandan-assets')
    doFirst {
        def repositoryRoot = rootProject.projectDir.parentFile
        def allInputs = publicManifest.files.findAll { name, value -> name.startsWith('web/') } + publicManifest.androidAssets
        allInputs.each { name, expected ->
            def source = new File(repositoryRoot, name)
            if (!source.isFile() || java.nio.file.Files.isSymbolicLink(source.toPath())) throw new GradleException('Unreviewed asset: ' + name)
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
            if (actual != expected.sha256) throw new GradleException('Asset hash mismatch: ' + name)
        }
    }
    doLast {
        def page = layout.buildDirectory.file('generated/guandan-assets/web/index.html').get().asFile
        page.setText(page.getText('UTF-8')
            .replace('<html lang="zh-CN"', '<html lang="zh-CN" data-platform="pad" data-safe-area="native"')
            .replace('</head>', '<link rel="stylesheet" href="/pad/pad.css?v=238"><link rel="stylesheet" href="/app/mobile.css?v=238"><link rel="stylesheet" href="/app/hand-layout.css?v=238"><link rel="stylesheet" href="/app/round-table.css?v=238"><link rel="stylesheet" href="/app/table-layout.css?v=238"><link rel="stylesheet" href="/app/phone-layout.css?v=238"><script src="/pad/pad.js?v=238" defer></script></head>')
            .replace('Desktop 1.8.45 · 公开版 · 离线单机与局域网联机', 'Android 1.8.45 · 公开版 · 离线单机与局域网联机')
            .replace('关闭窗口会保留应用。⌘Q退出，Control+⌘F全屏；⌘+与⌘−调整界面大小。', '手机固定横屏，同点数叠放；平板使用单层手牌。手机点击牌头选牌；系统返回先关闭面板，再返回桌面。每一步自动保存。'), 'UTF-8')
    }
}
android.sourceSets.all { assets.setSrcDirs([]) }
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/guandan-assets'))
tasks.named('preBuild').configure { dependsOn prepareWeb }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
